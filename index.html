<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewild — Stage 1 v12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bark:rgba(40,31,22,.86);
  --bark-solid:#2b2118;
  --edge:rgba(241,230,207,.16);
  --bone:#f1e6cf;
  --bone-dim:rgba(241,230,207,.64);
  --ochre:#d29b4a;
  --gum:#86b86a;
  --lake:#5ab0e0;
  --ember:#e8744f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2b2118;color:var(--bone);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#game{display:block;cursor:none}
.panel{position:fixed;background:var(--bark);border:1.5px solid var(--edge);border-radius:14px}

#stats{top:14px;left:14px;padding:12px 16px 12px;width:236px;max-height:calc(100vh - 110px);overflow-y:auto}
.cover{display:flex;height:8px;border-radius:5px;overflow:hidden;background:rgba(0,0,0,.38);margin:0 0 7px}
.cover i{display:block;height:100%;width:0}
.c0{background:#b08a5c}.c1{background:#a3c85e}.c2{background:#5f9a44}.c3{background:#2f6a36}.cb{background:#4a423b}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;font-size:13px;color:var(--bone-dim);margin-bottom:4px}
.legend span{display:flex;align-items:center;gap:5px}
.legend span b{margin-left:auto;color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.sep{height:1px;background:var(--edge);margin:6px 0}
#wild summary{cursor:pointer;list-style:none}
#wild summary::-webkit-details-marker{display:none}
#wild summary span::after{content:' \25B8';font-size:12px}
#wild[open] summary span::after{content:' \25BE'}
#species{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:14px;line-height:1.5;padding:0 0 6px 10px;color:var(--bone-dim)}
#species .z{opacity:.4}
#species b{color:var(--bone);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
#pct{font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#pct small{font-size:16px;font-weight:500;color:var(--bone-dim);margin-left:4px}
.meter{height:8px;border-radius:5px;background:rgba(0,0,0,.38);overflow:hidden;margin:9px 0 9px}
.meter>div{height:100%;width:0;border-radius:5px}
#pctFill{background:linear-gradient(90deg,var(--ochre),var(--gum))}
.row{display:flex;justify-content:space-between;font-size:15px;line-height:1.65;color:var(--bone-dim)}
.row b{color:var(--bone);font-weight:600;font-variant-numeric:tabular-nums}
#poachN,#fireN{color:var(--ember)}
#stealN,#penN{color:#e08ae0}

#waterPanel{left:50%;bottom:16px;transform:translateX(-50%);padding:9px 16px 11px;width:min(340px,80vw)}
#waterPanel .row{line-height:1.3}
#waterPanel .meter{height:12px;margin:7px 0 0}
#waterFill{background:linear-gradient(90deg,#3f8fc4,var(--lake))}
#waterStatus{color:var(--lake)}
#waterStatus.empty{color:var(--ember)}

#mini{top:14px;right:14px;padding:7px}
#musicBtn{position:fixed;right:14px;bottom:16px;font-size:14px;padding:7px 12px;background:var(--bark)}
#minimap{display:block;width:240px;height:240px;image-rendering:pixelated;border-radius:8px}

#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(460px,60vw)}
.toast{background:var(--bark);border:1.5px solid var(--edge);padding:6px 14px;border-radius:20px;font-size:15px;text-align:center;animation:tin .25s ease-out;transition:opacity .5s}
.toast.big{font-size:18px;font-weight:600;border-color:var(--gum)}
.toast.fade{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,23,16,.5);padding:20px}
#overlay.hidden{display:none}
.card{background:var(--bark-solid);border:1.5px solid var(--edge);border-radius:18px;padding:28px 32px 26px;max-width:440px;width:100%}
.card h1{font-size:60px;font-weight:700;line-height:.95;color:var(--gum)}
.card h1 span{display:block;font-size:20px;font-weight:500;color:var(--bone-dim);margin-top:8px}
.card p{font-size:17px;line-height:1.45;margin-top:16px;color:var(--bone)}
.card ul{list-style:none;margin-top:14px;font-size:16px;line-height:1.7;color:var(--bone-dim)}
.card ul b{color:var(--bone);font-weight:600}
.btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
button{font-family:inherit;font-size:18px;font-weight:600;background:var(--gum);color:#1d2913;border:0;border-radius:12px;padding:11px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--bone);border:1.5px solid var(--edge)}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
@media (max-width:700px){#mini{display:none}#stats{width:180px}#pct{font-size:32px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="stats" class="panel">
  <div id="pct">0.0<small>% rewilded</small></div>
  <div class="meter"><div id="pctFill"></div></div>
  <div class="cover"><i class="c0"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="cb"></i></div>
  <div class="legend">
    <span><i class="c0"></i>Bare<b>0%</b></span>
    <span><i class="c1"></i>Grass<b>0%</b></span>
    <span><i class="c2"></i>Scrub<b>0%</b></span>
    <span><i class="c3"></i>Forest<b>0%</b></span>
    <span><i class="cb"></i>Burnt<b>0%</b></span>
  </div>
  <div class="sep"></div>
  <div class="row">Poachers out <b id="poachN">0</b></div>
  <div class="row">Stealers out <b id="stealN">0</b></div>
  <div class="row">Animals in pens <b id="penN">0</b></div>
  <div class="row">Visits to come <b id="returnN">0</b></div>
  <div class="row">Poachers rewilded <b id="convN">0</b></div>
  <div class="row">Fires burning <b id="fireN">0</b></div>
  <div class="row">Cut off from water <b id="thirstN">0</b></div>
  <div class="row">Beaver streams <b id="streamN">0 m</b></div>
  <div class="sep"></div>
  <details id="wild">
    <summary class="row"><span>Wildlife</span><b id="animalN">0</b></summary>
    <div id="species"></div>
  </details>
  <div class="row">Time <b id="timeN">0:00</b></div>
</div>

<div id="waterPanel" class="panel">
  <div class="row">Water tank <b id="waterStatus"></b></div>
  <div class="meter"><div id="waterFill"></div></div>
</div>

<div id="mini" class="panel"><canvas id="minimap" width="200" height="200"></canvas></div>
<button id="musicBtn" class="ghost">Music on (M)</button>
<div id="toasts"></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';

/* ---------------- Constants & tuning ---------------- */
const W = 200, H = 200, N = W * H;      // 200 x 200 tiles, each ~5 m => ~1 km²
const TS = 28;                          // tile size in CSS px
const CH = 12;                          // tiles per render chunk (side)
const CW = Math.ceil(W / CH), CHN = Math.ceil(H / CH);
const DIRT = 0, ROCK = 1, WATER = 2, TAU = Math.PI * 2;

const CFG = {
  // growth (tuned by headless sim: ~25–40 min for an engaged player)
  SPREAD: 0.16, WATER_GROW: 0.045, MOIST_TIME: 25, SHORE_WET: 0.5, ROCK_MULT: 0.55,
  SPLASH_PROG: 0.45, SPLASH_R: 1.7, DISPERSE_SAMPLES: 10, DISPERSE_AMT: 0.4, SIM_DT: 0.2,
  // player
  PLAYER_SPEED: 7, FIRE_CD: 0.16, SHOT_COST: 2.5, TANK: 150, REFILL: 65, BLOB_SPEED: 16, RANGE: 8,
  // poachers
  POACHERS: 35, POACHER_SPEED: 1.3, POACHER_FLEE: 2.1, FLEE_R: 5, CHOP_RATE: 0.02,
  // animals
  ANIMAL_MAX: 140, ANIMAL_SPAWN_EVERY: 2.5, WIN_AT: 0.995,
  ANIMAL_BREED_HITS: 3, MAX_YOUNG: 3,
  SPRAY_BREED_WINDOW: 60,                 // spraying only breeds an animal fresh from a poacher, for this long
  NAT_YOUNG: 2, NAT_BREED_MIN: 180, NAT_BREED_MAX: 480, // otherwise animals with water access have young on their own
  THIRST_WARN: 300, THIRST_DIE: 180,      // warn after 5 min cut off from water; they die if still cut off 3 min later
  ANIMAL_HARD_MAX: 260,                   // most animals the map can hold
  TREE_AGE_RATE: 0.003, TREE_AGE_WET: 0.02,              // trees keep growing bigger after maturing
  TREE_SLOW: 0.6,      // shrub -> tree is slower than other stages
  OVERWATER: 3.5,      // hits of water on a finished tile before it steps up (meadow -> scrub -> trees)
  // beavers
  BEAVER_DIG: 9, BEAVER_POND_DIG: 4, BEAVER_POND_CHANCE: 0.75, BEAVER_MAX_WATER: 400, BEAVER_BUILDERS: 3,
  // threats
  POACHER_RETURNS: 2, STEALERS: 10,                     // of the 35, this many are stealers (25 fire-lighting poachers)
  CHOP_EVERY_MIN: 45, CHOP_EVERY_MAX: 90, CHOP_TIME: 5, // tree felling, about the same pace as fires
  STEALER_SPEED: 1.8, HUT_BUILD: 45, HUT_CAP: 10, STEALER_REST_MIN: 20, STEALER_REST_MAX: 40,
  HUNT_R: 60,          // how far a stealer looks for animals to steal, from wherever he is
  HUNT_CHANCE: 1,      // chance he sets off after a target when he spots one (otherwise keeps prowling)
  STEALER_START_MIN: 30, STEALER_START_MAX: 180, // staggered start, so huts appear gradually
  POACHER_RETURN_MIN: 90, POACHER_RETURN_MAX: 240,       // each poacher comes back once, after this many seconds
  FIRE_EVERY_MIN: 45, FIRE_EVERY_MAX: 90, MAX_NEW_FIRE: 10, MAX_BURNING: 30, FIRE_BURN_TIME: 14, FIRE_SPREAD: 0.0016,
  DIG_EVERY_MIN: 50, DIG_EVERY_MAX: 110, DIG_TIME: 6,
  // camera
  ZOOMS: [0.75, 0.9, 1, 1.2, 1.45, 1.75, 2.1, 2.5],
};

/* ---------------- RNG & noise ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R = Math.random;
function hash2(x, y, s){
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi,s), b = hash2(xi+1,yi,s), c = hash2(xi,yi+1,s), d = hash2(xi+1,yi+1,s);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x, y, s, oct){let t=0,a=1,f=1,n=0;for(let i=0;i<oct;i++){t+=vnoise(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2;}return t/n;}
function quant(arr, q){const s = Float32Array.from(arr).sort(); return s[Math.floor(q*(s.length-1))];}
const clamp = (v,a,b) => v<a?a:v>b?b:v;

/* ---------------- World state ---------------- */
const terr = new Uint8Array(N), hgt = new Uint8Array(N), stage = new Uint8Array(N), cap = new Uint8Array(N);
const shore = new Uint8Array(N), depth = new Uint8Array(N), dirtyFlag = new Uint8Array(N);
const prog = new Float32Array(N), moist = new Float32Array(N);
const scar = new Uint8Array(N);        // 0 none, 1 burnt (needs watering to regrow), 2 dug
const wdist = new Uint8Array(N);       // steps to nearest water
const ncap = new Uint8Array(N);        // natural cap, used for scoring (overwatering can raise cap)
const soak = new Float32Array(N);      // recent overwatering on finished tiles
const cover = new Uint32Array(4); let burntN = 0, beaverWater = 0, beaverToast = false, totalVisits = 0;
let convCount = {};
const blaze = new Float32Array(N), treeAge = new Float32Array(N);
const dam = new Uint8Array(N), tint = new Float32Array(N);
const reach = new Uint8Array(N);      // green ground with an unbroken green path to water
let burning = [];
let landCount = 0, DS = 1;
let dirtyQ = [];

let player, poachers, animals, blobs, parts;
let rewild = 0, poachersLeft = 0, elapsed = 0, simAcc = 0, animalTimer = 0;
let state = 'title', winShown = false, milestones = [];
let returning = [], fireTimer = 60, digTimer = 40, chopTimer = 50, zoomIdx = 2, huts = [], lockToastT = -99, herds = [], reachT = 0, thirstT = 0;

/* ---------------- Map generation ---------------- */
function generate(seed){
  R = mulberry32(seed);
  const S = (seed % 9973) + 1; DS = S;
  const hn = new Float32Array(N), rn = new Float32Array(N), cn = new Float32Array(N);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x;
    tint[i]=fbm(x/8,y/8,S*3+7,2); hn[i]=fbm(x/26,y/26,S*3+1,4); rn[i]=fbm(x/9,y/9,S*3+2,3); cn[i]=fbm(x/14,y/14,S*3+3,3);
  }
  const h1=quant(hn,.74), h2=quant(hn,.90), rq=quant(rn,.76), c1=quant(cn,.4), c2=quant(cn,.78);

  // lakes: always three, one in each third of the map around the middle
  const lakes=[]; const rot=R()*TAU;
  for (let k=0;k<3;k++){
    for (let t=0;t<200;t++){
      const ang=rot+k*TAU/3+(R()-.5)*.6, dist=50+R()*22, r=8+R()*5;
      const x=clamp(W/2+Math.cos(ang)*dist,r+10,W-r-10), y=clamp(H/2+Math.sin(ang)*dist,r+10,H-r-10);
      if (t<199 && lakes.some(l=>Math.hypot(l.x-x,l.y-y)<l.r+r+40)) continue;
      lakes.push({x,y,r}); break;
    }
  }

  landCount=0;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x;
    let wd=9;
    for (const l of lakes){
      const d=Math.hypot(x+.5-l.x,y+.5-l.y)/l.r + (fbm(x/7,y/7,S*3+5,2)-.5)*.7;
      if (d<wd) wd=d;
    }
    stage[i]=0; prog[i]=0; moist[i]=0; shore[i]=0; dirtyFlag[i]=0; scar[i]=0; blaze[i]=0; treeAge[i]=0; soak[i]=0; ncap[i]=0; dam[i]=0;
    if (wd<1){ terr[i]=WATER; hgt[i]=0; cap[i]=0; continue; }
    let h = hn[i]>h2?2:hn[i]>h1?1:0; if (wd<1.8) h=0;
    hgt[i]=h;
    terr[i] = (rn[i]>rq || (h===2 && rn[i]>rq-.05)) ? ROCK : DIRT;
    if (wd<1.25) terr[i]=DIRT;
    let c = cn[i]<c1?1:cn[i]<c2?2:3;
    if (terr[i]===ROCK) c=Math.min(c,2);
    if (h===2 && c===3 && hash2(x,y,S)<.5) c=2;
    if (wd<1.6) c=3;
    cap[i]=c; ncap[i]=c; landCount++;
  }
  // shore + water depth
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x;
    let nearW=0, minD=9;
    for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++){
      const X=x+dx,Y=y+dy; if (X<0||Y<0||X>=W||Y>=H) continue;
      const j=Y*W+X, cheb=Math.max(Math.abs(dx),Math.abs(dy));
      if (terr[i]===WATER){ if (terr[j]!==WATER && cheb<minD) minD=cheb; }
      else if (cheb<=1 && terr[j]===WATER) nearW=1;
    }
    if (terr[i]===WATER) depth[i] = minD<=1?0:minD<=2?1:2;
    else { shore[i]=nearW; if (nearW && R()<.7) stage[i]=1; }
  }

  // distance to water (used for palms, reeds and crocodiles)
  wdist.fill(255); const q=[];
  for (let i=0;i<N;i++) if (terr[i]===WATER){ wdist[i]=0; q.push(i); }
  for (let h=0;h<q.length;h++){
    const i=q[h], d=wdist[i]; if (d>=8) continue;
    const x=i%W, y=(i/W)|0;
    if (x>0&&wdist[i-1]>d+1){wdist[i-1]=d+1;q.push(i-1);}
    if (x<W-1&&wdist[i+1]>d+1){wdist[i+1]=d+1;q.push(i+1);}
    if (y>0&&wdist[i-W]>d+1){wdist[i-W]=d+1;q.push(i-W);}
    if (y<H-1&&wdist[i+W]>d+1){wdist[i+W]=d+1;q.push(i+W);}
  }

  // player start near centre on land
  let best=null, bd=1e9;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x; if (terr[i]===WATER) continue;
    const d=Math.hypot(x-W/2,y-H/2)+hgt[i]*3; if (d<bd){bd=d;best=[x,y];}
  }
  player = {x:best[0]+.5, y:best[1]+.5, aim:0, water:CFG.TANK, cd:0, walk:0, moving:false, refilling:false};

  poachers=[]; animals=[]; blobs=[]; parts=[];
  let guard=0;
  while (poachers.length<CFG.POACHERS && guard++<20000){
    const x=R()*W, y=R()*H, i=(y|0)*W+(x|0);
    if (terr[i]===WATER || Math.hypot(x-player.x,y-player.y)<20) continue;
    poachers.push({x,y,dir:R()*TAU,spd:CFG.POACHER_SPEED,state:'wander',t:R()*3,walk:R()*10,wob:0,stumble:0,think:false,returned:false,visits:0,made:[],kind:poachers.length<CFG.POACHERS-CFG.STEALERS?'poacher':'stealer'});
  }
  poachersLeft=totalVisits=poachers.length*(1+CFG.POACHER_RETURNS);
  convCount={}; beaverWater=0; beaverToast=false;
  returning=[]; burning=[]; fireTimer=60+R()*30; digTimer=40+R()*30; chopTimer=50+R()*30; huts=[]; herds=[]; reach.fill(0);
  rewild=0; elapsed=0; simAcc=0; animalTimer=0; winShown=false; milestones=[.10,.25,.50,.75,.90];
  dirtyQ=[]; chunks.clear();
  cam.x=player.x; cam.y=player.y;
  for (let i=0;i<N;i++) mmPixel(i);
  computeRewild();
}

/* ---------------- Growth helpers ---------------- */
function queueDraw(i){ if (!dirtyFlag[i]){ dirtyFlag[i]=1; dirtyQ.push(i); } }
function markChanged(i){
  if (stage[i]>0 && scar[i]===2) scar[i]=0; if (stage[i]<3) treeAge[i]=0; mmPixel(i); queueDraw(i);
  const x=i%W; if (x>0) queueDraw(i-1); if (x<W-1) queueDraw(i+1); if (i>=W) queueDraw(i-W); if (i<N-W) queueDraw(i+W); // neighbours redraw their soft edges
}
function setStage(i,s){ stage[i]=s; prog[i]=0; markChanged(i); }
function addProg(i,amt){
  if (terr[i]===WATER || scar[i]===1) return; // burnt ground needs watering first
  let s=stage[i]; const c=cap[i]; if (s>=c) return;
  let p=prog[i]+amt, changed=false;
  while (p>=1 && s<c){ p-=1; s++; changed=true; }
  if (s>=c) p=0;
  stage[i]=s; prog[i]=p;
  if (changed) markChanged(i);
}
function splash(cx,cy,Rr,amt,wet){
  for (let y=Math.floor(cy-Rr); y<=cy+Rr; y++) for (let x=Math.floor(cx-Rr); x<=cx+Rr; x++){
    if (x<0||y<0||x>=W||y>=H) continue;
    const i=y*W+x; if (terr[i]===WATER) continue;
    const d=Math.hypot(x+.5-cx,y+.5-cy); if (d>Rr) continue;
    const f=1-d/(Rr+.3);
    if (wet){
      moist[i]=Math.max(moist[i], .6+.4*f);
      if (blaze[i]>0){ blaze[i]=0; burst(x+.5,y+.5,2,'smoke'); }
      if (scar[i]===1){ scar[i]=0; markChanged(i); } // re-sown
      else if (stage[i]>=cap[i] && cap[i]<3){ // overwatering a finished patch pushes it up a stage
        soak[i]+=f;
        if (soak[i]>=CFG.OVERWATER){ soak[i]=0; cap[i]++; burst(x+.5,y+.5,2,'sparkle'); }
      }
    }
    addProg(i, amt*f);
  }
}
function computeRewild(){
  let tot=0;
  for (let i=0;i<N;i++){ if (terr[i]===WATER) continue; const c=ncap[i]||1; tot += stage[i]>=c?1:(stage[i]+prog[i])/c; }
  rewild = tot/landCount;
}
function simTick(){
  const dt=CFG.SIM_DT; let tot=0; cover.fill(0); burntN=0;
  for (let y=0;y<H;y++){
    const yo=y*W;
    for (let x=0;x<W;x++){
      const i=yo+x; if (terr[i]===WATER) continue;
      let m=moist[i];
      if (soak[i]>0) soak[i]=Math.max(0,soak[i]-dt*.02);
      if (m>0){ m-=dt/CFG.MOIST_TIME; if (m<0) m=0; moist[i]=m; }
      const s=stage[i], c=cap[i];

/* ---------------- Fire ---------------- */
function ignite(i){
  if (i<0 || blaze[i]>0 || terr[i]===WATER || stage[i]===0) return false;
  blaze[i]=.001; burning.push(i); return true;
}
function fireTick(dt){
  if (!burning.length) return;
  const next=[];
  for (const i of burning){
    if (blaze[i]<=0) continue;                       // put out
    blaze[i]+=dt/CFG.FIRE_BURN_TIME;
    if (blaze[i]>=1){ blaze[i]=0; scar[i]=1; moist[i]=0; setStage(i,0); continue; } // burnt out
    next.push(i);
  }
  const len=next.length; let room=CFG.MAX_BURNING-len;
  for (let k=0;k<len && room>0;k++){
    const i=next[k], x=i%W, y=(i/W)|0;
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      if ((!dx&&!dy)||room<=0) continue;
      const X=x+dx, Y=y+dy; if (X<0||Y<0||X>=W||Y>=H) continue;
      const j=Y*W+X; if (terr[j]===WATER||blaze[j]>0||stage[j]===0) continue;
      if (R()<CFG.FIRE_SPREAD*stage[j]*(1-moist[j])){ blaze[j]=.001; next.push(j); room--; }
    }
  }
  burning=next;
}

const ANIMAL_KEYS=Object.keys(ANIMALS);
function pickAnimal(ok){
  const ks=ANIMAL_KEYS.filter(k=>!ok||ok(k));
  let tot=0; for (const k of ks) tot+=ANIMALS[k].w;
  let r=R()*tot; for (const k of ks){ r-=ANIMALS[k].w; if (r<=0) return k; } return ks[0]||'roo';
}
function spawnAnimal(x,y,type,scale){
  const a={x,y,type,vx:0,vy:0,t:R()*2,face:R()<.5?-1:1,scale,hop:0,fert:2+R()*3,z:0,v:(R()*4)|0,drinks:0,dry:0};
  animals.push(a); joinHerd(a); return a;
}
const HERD_TYPES=new Set(['zebra','elephant','horse','giraffe','deer','monkey','roo','rhino']);
function joinHerd(a){
  if (!HERD_TYPES.has(a.type)) return;
  let best=null, bd=25;
  for (const h of herds){ if (h.type!==a.type) continue; const d=Math.hypot(h.cx-a.x,h.cy-a.y); if (d<bd){ bd=d; best=h; } }
  if (!best){ best={type:a.type,x:a.x,y:a.y,cx:a.x,cy:a.y,n:1,t:5+R()*10}; herds.push(best); }
  a.herd=best;
  const r=.7+R()*1.8, an=R()*TAU; a.hox=Math.cos(an)*r; a.hoy=Math.sin(an)*r*.7; // own spot within the group
}
function moveHerd(h){ // pick the group's next grazing spot, favouring quiet ground with water access
  let best=null, bs=1e9;
  for (let k=0;k<10;k++){
    const ang=R()*TAU, dist=R()<.4?8+R()*14:2+R()*5;
    const x=h.cx+Math.cos(ang)*dist, y=h.cy+Math.sin(ang)*dist, j=tileAt(x,y);
    if (!goodHabitat(h.type,j)) continue;
    const sc=densAt(x,y)*2+dist*.05+R()*1.5-(reach[j]?2:0);
    if (sc<bs){ bs=sc; best=[x,y]; }
  }
  if (best){ h.x=best[0]; h.y=best[1]; } else { h.x=h.cx; h.y=h.cy; }
}
function hasWater(a){
  const hb=ANIMALS[a.type].hab; if (hb==='air'||hb==='water'||hb==='beaver') return true;
  const j=tileAt(a.x,a.y); return j>=0 && (reach[j]===1 || shore[j]===1);
}
function computeReach(){
  reach.fill(0); const q=[];
  for (let i=0;i<N;i++) if (terr[i]!==WATER && shore[i] && stage[i]>=1){ reach[i]=1; q.push(i); }
  for (let h=0;h<q.length;h++){
    const i=q[h], x=i%W;
    for (const j of [x>0?i-1:-1, x<W-1?i+1:-1, i-W, i+W]){
      if (j<0||j>=N||reach[j]||terr[j]===WATER||stage[j]<1) continue;
      reach[j]=1; q.push(j);
    }
  }
}
function plural(n){ return n==='deer'?'deer': n==='fox'?'foxes': n+'s'; }
function goodHabitat(type,j){
  if (j<0) return false;
  const h=ANIMALS[type].hab;
  if (h==='air') return true;
  if (h==='water'||h==='beaver') return terr[j]===WATER||shore[j]===1;
  if (terr[j]===WATER) return false;
  return h==='trees' ? stage[j]>=2 : stage[j]>0;
}
function animalBlocked(type,cur,nxt){
  if (nxt<0) return true;
  const h=ANIMALS[type].hab;
  if (h==='air') return false;
  if ((h==='land'||h==='trees') && terr[nxt]===WATER) return true;
  return !goodHabitat(type,nxt) && cur>=0 && goodHabitat(type,cur);
}
/* animals spread out: they pick destinations in less crowded habitat and slide along corridor edges to reach them */
const DC=10, DGW=Math.ceil(W/DC), DGH=Math.ceil(H/DC), dens=new Uint16Array(DGW*DGH); let densT=0;
function densAt(x,y){ const cx=(x/DC)|0, cy=(y/DC)|0; if (cx<0||cy<0||cx>=DGW||cy>=DGH) return 99; return dens[cy*DGW+cx]; }
function updateDensity(){
  dens.fill(0); for (const h of herds){ h.n=0; h.sx=0; h.sy=0; }
  for (const a of animals){
    if (a.herd){ a.herd.n++; a.herd.sx+=a.x; a.herd.sy+=a.y; }
    if (a.type==='bird') continue; const cx=(a.x/DC)|0, cy=(a.y/DC)|0; if (cx>=0&&cy>=0&&cx<DGW&&cy<DGH) dens[cy*DGW+cx]++;
  }
  herds=herds.filter(h=>h.n>0);
  for (const h of herds){ h.cx=h.sx/h.n; h.cy=h.sy/h.n; }
}
function pickRoam(a){
  const A=ANIMALS[a.type]; let best=null, bs=1e9;
  if (a.herd){ // herd animals graze around their group's spot
    const h=a.herd; let x=h.x+a.hox+(R()-.5)*.8, y=h.y+a.hoy+(R()-.5)*.8;
    if (!goodHabitat(a.type,tileAt(x,y))){ x=h.x; y=h.y; }
    a.tx=x; a.ty=y; return;
  }
  const far=R()<.35;
  for (let k=0;k<8;k++){
    const ang=R()*TAU, dist=far?10+R()*16:2+R()*6;
    const x=a.x+Math.cos(ang)*dist, y=a.y+Math.sin(ang)*dist, j=tileAt(x,y);
    if (!goodHabitat(a.type,j)) continue;
    const sc=densAt(x,y)*3+dist*.05+R()*1.5;
    if (sc<bs){ bs=sc; best=[x,y]; }
  }
  if (best){ a.tx=best[0]; a.ty=best[1]; }
  else { const ang=R()*TAU, sp=A.spd*(.6+.4*a.scale); a.vx=Math.cos(ang)*sp; a.vy=Math.sin(ang)*sp; a.tx=null; }
}

/* ---------------- Beavers ---------------- */
function nearestWater(x,y){
  const cx=Math.floor(x), cy=Math.floor(y);
  for (let r=0;r<=90;r++){
    let best=-1, bd=1e9;
    const test=(X,Y)=>{ if (X<0||Y<0||X>=W||Y>=H) return; const j=Y*W+X; if (terr[j]===WATER){ const d=(X-cx)**2+(Y-cy)**2; if (d<bd){bd=d;best=j;} } };
    for (let d=-r;d<=r;d++){ test(cx+d,cy-r); if (r) test(cx+d,cy+r); }
    for (let d=-r+1;d<=r-1;d++){ test(cx-r,cy+d); test(cx+r,cy+d); }
    if (best>=0) return best;
  }
  return -1;
}
function canFlood(j){
  const x=j%W+.5, y=((j/W)|0)+.5;
  if (Math.hypot(player.x-x,player.y-y)<1.2) return false;
  for (const p of poachers) if (Math.hypot(p.x-x,p.y-y)<1.1) return false;
  for (const a of animals){ const h=ANIMALS[a.type].hab; if (h==='land'||h==='trees'){ if (Math.hypot(a.x-x,a.y-y)<1.1) return false; } }
  return true;
}
function makeWater(i){
  if (terr[i]===WATER) return;
  blaze[i]=0; terr[i]=WATER; stage[i]=0; prog[i]=0; cap[i]=0; ncap[i]=0; scar[i]=0; moist[i]=0; hgt[i]=0; shore[i]=0; depth[i]=0; treeAge[i]=0; soak[i]=0;
  landCount--;
  const x=i%W, y=(i/W)|0;
  for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
    const X=x+dx, Y=y+dy; if (X<0||Y<0||X>=W||Y>=H) continue;
    const j=Y*W+X; if (terr[j]!==WATER) shore[j]=1;
    markChanged(j);
  }
  wdist[i]=0; const q=[i];
  for (let h=0;h<q.length;h++){
    const k=q[h], d=wdist[k]; if (d>=8) continue; const kx=k%W, ky=(k/W)|0;
    for (const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X=kx+ex, Y=ky+ey; if (X<0||Y<0||X>=W||Y>=H) continue; const j=Y*W+X; if (wdist[j]>d+1){ wdist[j]=d+1; q.push(j); } }

}
function builders(){ let n=0; for (const a of animals) if (a.type==='beaver'&&(a.bm==='build'||a.bm==='pond')) n++; return n; }
function endProject(a){ a.bm='rest'; a.rest=120+R()*120; a.goal=null; }
function startStream(a){
  if (builders()>=CFG.BEAVER_BUILDERS || beaverWater>=CFG.BEAVER_MAX_WATER){ endProject(a); return; }
  let sx=0, sy=0, n=0; const bx=Math.floor(a.x), by=Math.floor(a.y);
  for (let dy=-3;dy<=3;dy++) for (let dx=-3;dx<=3;dx++){ const j=tileAt(bx+dx+.5,by+dy+.5); if (j>=0&&terr[j]===WATER){ sx+=dx; sy+=dy; n++; } }
  const ang=(n?Math.atan2(-sy,-sx):R()*TAU)+(R()-.5)*1.2; // head away from the water
  let hx=a.x, hy=a.y, head=-1;
  for (let k=0;k<6;k++){ hx+=Math.cos(ang); hy+=Math.sin(ang); const j=tileAt(hx,hy); if (j<0) break; if (terr[j]!==WATER){ head=j; break; } }
  if (head<0){ endProject(a); return; }
  a.dir=ang; a.len=0; a.target=5+((R()*6)|0); a.head=head; a.bm='build'; a.dig=CFG.BEAVER_DIG;
  if (!beaverToast){ beaverToast=true; toast('A beaver has started digging a stream'); }
}
function digStream(a){
  if (beaverWater>=CFG.BEAVER_MAX_WATER){ endProject(a); return; }
  if (!canFlood(a.head)) return; // someone is standing there; try again later
  makeWater(a.head); beaverWater++; a.len++;
  if (a.len>=a.target){
    dam[a.head]=1; markChanged(a.head); // log dam at the end of the stream
    if (R()<CFG.BEAVER_POND_CHANCE){ a.bm='pond'; a.pondC=a.head; a.pondR=1.3+R()*.9; a.dig=CFG.BEAVER_POND_DIG; }

  }
  a.dir+=(R()-.5)*1.1; // meander

  const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({dx,dy,sc:Math.cos(Math.atan2(dy,dx)-a.dir)+R()*.9})).sort((p,q)=>q.sc-p.sc);
  for (const o of opts){
    const X=x+o.dx, Y=y+o.dy; if (X<1||Y<1||X>=W-1||Y>=H-1) continue;
    const j=Y*W+X; if (terr[j]===WATER || (terr[j]===ROCK&&R()<.7)) continue;
    let wn=0; for (const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]]){ const k=(Y+ey)*W+(X+ex); if (k!==a.head && terr[k]===WATER) wn++; }
    if (wn>0 && a.len<a.target-1) continue; // keep it a single channel until the end
    a.head=j; return;
  }
  endProject(a);
}
function digPond(a){
  if (beaverWater>=CFG.BEAVER_MAX_WATER){ endProject(a); return; }
  const cx=a.pondC%W+.5, cy=((a.pondC/W)|0)+.5; let best=-1, bd=1e9;
  for (let dy=-3;dy<=3;dy++) for (let dx=-3;dx<=3;dx++){
    const j=tileAt(cx+dx,cy+dy); if (j<0||terr[j]===WATER) continue;
    const d=Math.hypot(dx,dy)+R()*.5; if (d>a.pondR||d>=bd) continue;
    const jx=j%W, jy=(j/W)|0; let adj=false;
    for (const [ex,ey] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X=jx+ex, Y=jy+ey; if (X>=0&&Y>=0&&X<W&&Y<H&&terr[Y*W+X]===WATER) adj=true; }
    if (adj){ bd=d; best=j; }

function beaverMove(a,tx,ty,dt){

  const st=Math.min(d,sp*dt); a.x+=dx/d*st; a.y+=dy/d*st; a.hop+=dt*3; if (a.vx) a.face=a.vx>0?1:-1;

function updateBeaver(a,dt){ // returns true while the beaver is busy (seeking or building)

    a.rest-=dt;

    const j=tileAt(a.x,a.y), gx=a.goal%W+.5, gy=((a.goal/W)|0)+.5;
    if (j>=0 && (shore[j]||terr[j]===WATER) && Math.hypot(gx-a.x,gy-a.y)<3){ startStream(a); return true; }

function pickConversionAnimal(made,i){

function finishDig(p){

/* ---------------- Tree fellers ---------------- */
function nearestTree(x,y,r){
  let best=-1, bd=1e9; const cx=Math.floor(x), cy=Math.floor(y);
  for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){ const j=tileAt(cx+dx+.5,cy+dy+.5); if (j>=0&&stage[j]===3){ const d=dx*dx+dy*dy; if (d<bd){bd=d;best=j;} } }
  return best;
}
function chopAI(p,dt){

/* ---------------- Stealers and their huts ---------------- */
const HUT_COLS=['#e0503c','#3c8fe0','#f2c230','#44b36a','#e07bd0','#f08a30','#5ad0d0','#b07a50','#9a6ae0','#e8e8e8']; let hutSeq=0; // each stealer and its hut share a flag colour
function siteHut(p){
  for (let k=0;k<300;k++){
    const x=p.x+(R()-.5)*20, y=p.y+(R()-.5)*20, j=tileAt(x,y);
    if (j<0||terr[j]===WATER||wdist[j]<3) continue;
    if (x<3||y<3||x>W-3||y>H-3) continue;
    if (huts.some(h=>Math.hypot(h.x-x,h.y-y)<7)) continue;
    return {x:Math.floor(x)+.5,y:Math.floor(y)+.5,built:false,prog:0,owner:p,ownerGone:false,captives:[],col:HUT_COLS[(hutSeq++)%HUT_COLS.length]};

  return {x:p.x,y:p.y,built:false,prog:0,owner:p,ownerGone:false,captives:[],col:HUT_COLS[(hutSeq++)%HUT_COLS.length]};
}
function huntable(a){ return a.type!=='bird' && a.type!=='beaver' && ANIMALS[a.type].hab!=='water' && !a.hunter; }
function stealerAI(p,dt){
  if (p.delay===undefined) p.delay = p.returned ? 20+R()*40 : CFG.STEALER_START_MIN+R()*(CFG.STEALER_START_MAX-CFG.STEALER_START_MIN);
  if (p.delay>0){ // wanders like any poacher before settling down
    p.delay-=dt; p.t-=dt;
    if (p.t<=0){ p.state='wander'; p.dir=R()*TAU; p.spd=CFG.POACHER_SPEED*(.6+R()*.4); p.t=2+R()*4; }
    return;
  }
  if (!p.hut){ p.hut=siteHut(p); huts.push(p.hut); p.state='build'; }
  const h=p.hut, sp=CFG.STEALER_SPEED;
  const goTo=(x,y,speed)=>{ const d=Math.hypot(x-p.x,y-p.y); if (d>.05){ p.dir=Math.atan2(y-p.y,x-p.x); p.spd=speed; } else p.spd=0; return d; };
  if (!h.built){
    p.state='build';
    if (goTo(h.x+.9,h.y+.6,CFG.POACHER_SPEED*1.3)<.6){
      p.spd=0; h.prog+=dt/CFG.HUT_BUILD; if (R()<dt*3) burst(h.x,h.y,2,'chip');
      if (h.prog>=1){ h.built=true; p.state='rest'; p.t=5+R()*10; }
    }

  }
  if (p.state==='return'){
    if (goTo(h.x,h.y+2,sp)<.8){
      const a=p.carry; p.carry=null;
      if (a){ a.hunter=null; a.x=h.x; a.y=h.y; a.ox=(R()-.5)*1.4; a.oy=(R()-.5)*.6; a.vx=a.vy=0; h.captives.push(a); }
      p.state='rest'; p.t=CFG.STEALER_REST_MIN+R()*(CFG.STEALER_REST_MAX-CFG.STEALER_REST_MIN);
    }
    return;
  }
  if (p.state==='hunt'){
    const a=p.target; p.t-=dt;
    if (!a || animals.indexOf(a)<0 || p.t<=0){
      if (a) a.hunter=null; p.target=null; p.state='prowl'; p.t=4+R()*4; return;
    }
    const d=goTo(a.x,a.y,sp);
    if (d<4 && R()<dt*.8){ // the animal sometimes bolts away
      const ang=Math.atan2(a.y-p.y,a.x-p.x)+(R()-.5); a.tx=a.x+Math.cos(ang)*5; a.ty=a.y+Math.sin(ang)*5; a.t=2;
    }
    if (d<.55){
      animals.splice(animals.indexOf(a),1); a.dry=0; a.warned=false; p.carry=a; p.target=null; p.state='return';
      toast('A stealer caught '+aOrAn(ANIMALS[a.type].name)+'. Look for the '+colName(h.col)+' flag','big');
    }
    return;
  }
  if (p.target){ p.target.hunter=null; p.target=null; }
  p.t-=dt;
  if (p.state==='rest' && p.t>0){ // brief rest just outside the gate after dropping an animal off
    const lx=h.x, ly=h.y+2.2;
    if (Math.hypot(lx-p.x,ly-p.y)>1.3) goTo(lx+(R()-.5)*1.5,ly+(R()-.5)*.6,CFG.POACHER_SPEED);

  let best=null, bd=CFG.HUNT_R;
  for (const a of animals){ if (!huntable(a)) continue; const d=Math.hypot(a.x-p.x,a.y-p.y); if (d<bd){ bd=d; best=a; } }
  if (best && R()<CFG.HUNT_CHANCE){ p.target=best; best.hunter=p; p.state='hunt'; p.t=45; }
  else { p.state='prowl'; p.dir=R()*TAU; p.t=6+R()*6; }
}
function colName(c){ return {'#e0503c':'red','#3c8fe0':'blue','#f2c230':'yellow','#44b36a':'green','#e07bd0':'pink','#f08a30':'orange','#5ad0d0':'teal','#b07a50':'brown','#9a6ae0':'purple','#e8e8e8':'white'}[c]||'coloured'; }

  ctx.beginPath();
  if (!h.ownerGone){ ctx.moveTo(gl[0],gl[1]-s*.14); ctx.lineTo(pts[gateK+1][0],pts[gateK+1][1]-s*.14); ctx.moveTo(gl[0],gl[1]-s*.3); ctx.lineTo(pts[gateK+1][0],pts[gateK+1][1]-s*.3); ctx.moveTo(gl[0],gl[1]-s*.14); ctx.lineTo(pts[gateK+1][0],pts[gateK+1][1]-s*.3); }
  else { ctx.moveTo(gl[0],gl[1]-s*.14); ctx.lineTo(gl[0]-s*.2,gl[1]+s*.4); ctx.moveTo(gl[0],gl[1]-s*.3); ctx.lineTo(gl[0]-s*.2,gl[1]+s*.24); }
  ctx.stroke();
  if (!h.ownerGone && h.built){ ctx.fillStyle='#d4b13a'; ctx.fillRect(g[0]-s*.06,g[1]-s*.26,s*.12,s*.1); ctx.strokeStyle='#d4b13a'; ctx.lineWidth=s*.025; ctx.beginPath(); ctx.arc(g[0],g[1]-s*.26,s*.045,Math.PI,0); ctx.stroke(); }
  if (h.captives.length){
    ctx.fillStyle='rgba(40,30,20,.8)'; const tx=sx+R2*.75, ty=sy-R2*.75; circ(ctx,tx,ty,s*.22);
    ctx.fillStyle='#f1e6cf'; ctx.font='600 '+Math.round(s*.26)+'px Fredoka, Trebuchet MS, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(h.captives.length+'/'+CFG.HUT_CAP,tx,ty+s*.01);
  }
}

/* ---------------- Particles ---------------- */
function burst(x,y,n,type){
  for (let k=0;k<n;k++){
    const a=R()*TAU, sp=.8+R()*2.2;
    const p={x,y,z:.2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.6,vz:2+R()*3,life:.6+R()*.6,type};
    if (type==='drop'){ p.vx*=.6; p.vy*=.6; p.vz=1.5+R()*2; p.life=.35+R()*.3; }
    if (type==='heart'){ p.vx*=.2; p.vy=0; p.vz=1.4; p.life=1.1; }
    if (type==='chip'){ p.life=.5; }
    if (type==='ring'){ p.vx=p.vy=p.vz=0; p.z=0; p.life=.55; }
    if (type==='smoke'){ p.vx=(R()-.5)*.3; p.vy=0; p.vz=.9; p.z=.4; p.life=1.8; }
    p.max=p.life; parts.push(p);
  }
}

/* ---------------- Update ---------------- */
function update(dt){
  elapsed+=dt;
  // player movement
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  player.moving = mx!==0||my!==0;
  if (player.moving){
    const l=Math.hypot(mx,my); mx/=l; my/=l;
    const sp=CFG.PLAYER_SPEED*dt;
    const nx=player.x+mx*sp; if (!blocked(nx,player.y,.3)) player.x=nx;
    const ny=player.y+my*sp; if (!blocked(player.x,ny,.3)) player.y=ny;
    player.walk+=dt;
  }
  const mw=screenToWorld(mouse.x,mouse.y);
  player.aim=Math.atan2(mw.y-player.y,mw.x-player.x);

  // refill
  player.refilling=false;
  for (let dy=-2;dy<=2 && !player.refilling;dy++) for (let dx=-2;dx<=2;dx++){
    const i=tileAt(player.x+dx,player.y+dy);
    if (i>=0 && terr[i]===WATER){
      const cx=Math.floor(player.x+dx)+.5, cy=Math.floor(player.y+dy)+.5;
      if (Math.hypot(cx-player.x,cy-player.y)<1.8){ player.refilling=true; break; }
    }
  }
  if (player.refilling && player.water<CFG.TANK){
    player.water=Math.min(CFG.TANK,player.water+CFG.REFILL*dt);
    if (R()<dt*8) burst(player.x+(R()-.5),player.y+(R()-.5),2,'drop');
  }

  // firing
  player.cd-=dt;
  if (mouse.down && player.cd<=0){
    if (player.water>=CFG.SHOT_COST){ fire(); player.cd=CFG.FIRE_CD; }
    else { player.cd=.4; if (elapsed-lastEmptyToast>4){ lastEmptyToast=elapsed; toast('Tank empty — stand beside a lake to refill'); } }
  }

  // blobs
  for (const b of blobs){
    b.t+=dt*CFG.BLOB_SPEED/b.dist;
    const t=Math.min(b.t,1);
    b.x=b.sx+(b.tx-b.sx)*t; b.y=b.sy+(b.ty-b.sy)*t; b.z=Math.sin(Math.PI*t)*b.arc;
    for (const p of poachers){
      if (!p.dead && Math.hypot(p.x-b.x,p.y-b.y)<.55){ convertPoacher(p); b.done=true; break; }
    }
    if (b.done) continue;
    for (const a of animals){
      const r=.3+.25*a.scale*ANIMALS[a.type].size;
      if ((b.z<.6||a.type==='bird') && Math.hypot(a.x-b.x,a.y-(b.y))<r){
        a.scale=Math.min(1,a.scale+.15); burst(a.x,a.y-.4,3,'heart');
        a.drinks++;
        if (elapsed<(a.sprayUntil||0) && a.drinks>=CFG.ANIMAL_BREED_HITS && (a.young||0)<CFG.MAX_YOUNG && elapsed>=(a.nextBreed||0)){
          a.drinks=0; a.nextBreed=elapsed+4;
          const n=Math.min(1+(R()<.5?1:0), CFG.MAX_YOUNG-(a.young||0)); a.young=(a.young||0)+n;
          for (let q=0;q<n && animals.length<CFG.ANIMAL_HARD_MAX;q++){
            let bx=a.x+(R()-.5)*1.4, by=a.y+(R()-.5)*1.4; const j=tileAt(bx,by);
            if (j<0 || (terr[j]===WATER && ANIMALS[a.type].hab!=='water' && ANIMALS[a.type].hab!=='air')){ bx=a.x; by=a.y; }
            const y2=spawnAnimal(bx,by,a.type,.5); y2.sprayUntil=a.sprayUntil; // young can be sprayed too until the window closes
          }
          burst(a.x,a.y-.4,8,'heart'); burst(a.x,a.y,10,'sparkle');
        }
        splash(a.x,a.y,CFG.SPLASH_R,CFG.SPLASH_PROG,true); burst(a.x,a.y,8,'drop');
        b.done=true; break;
      }
    }
    if (b.done) continue;
    if (b.t>=1){ for (const h of huts) if (Math.hypot(h.x-b.tx,h.y-b.ty)<2.1){ hitHut(h); break; } }
    if (b.t>=1){ splash(b.tx,b.ty,CFG.SPLASH_R,CFG.SPLASH_PROG,true); burst(b.tx,b.ty,10,'drop'); burst(b.tx,b.ty,1,'ring'); b.done=true; }
  }
  blobs=blobs.filter(b=>!b.done);

  // poachers
  for (const p of poachers){
    if (p.dead) continue;
    const d=Math.hypot(p.x-player.x,p.y-player.y);
    p.walk+=dt;
    if (d<CFG.FLEE_R){
      if (p.state!=='flee'){ p.state='flee'; p.stumble=0; }
      p.wob=clamp(p.wob+(R()-.5)*dt*3,-.7,.7);
      if (p.stumble>0){ p.stumble-=dt; p.spd=0; }
      else {
        p.dir=Math.atan2(p.y-player.y,p.x-player.x)+p.wob; p.spd=CFG.POACHER_FLEE;
        if (R()<dt*.25) p.stumble=.7; // dopey
      }
    } else {
      if (p.state==='flee'){ p.state= p.kind==='stealer' ? (p.carry?'return':'rest') : 'wander'; p.t=.6; p.spd=CFG.POACHER_SPEED*.6; }
      if (p.kind==='stealer') stealerAI(p,dt);
      else if (p.state==='toChop'||p.state==='chop') chopAI(p,dt);
      else {
        p.t-=dt;
        if (p.t<=0){
          if (p.state==='dig') finishDig(p);
          if (R()<.3){ p.state='idle'; p.spd=0; p.t=1+R()*2.5; p.think=R()<.45; }
          else { p.state='wander'; p.dir=R()*TAU; p.spd=CFG.POACHER_SPEED*(.7+R()*.5); p.t=2+R()*4; p.think=false; }
        }
      }
    }
    if (p.spd>0){
      const nx=p.x+Math.cos(p.dir)*p.spd*dt, ny=p.y+Math.sin(p.dir)*p.spd*dt;
      if (!blocked(nx,ny,.3)){ p.x=nx; p.y=ny; }
      else if (p.state==='flee'){
        const alt=p.dir+(R()<.5?1:-1)*Math.PI/2;
        const ax=p.x+Math.cos(alt)*p.spd*dt, ay=p.y+Math.sin(alt)*p.spd*dt;
        if (!blocked(ax,ay,.3)){ p.x=ax; p.y=ay; }
      } else if (p.kind==='stealer'||p.state==='toChop'){ // go round obstacles toward a goal
        for (const off of [.8,-.8,1.6,-1.6]){ const a2=p.dir+off, ax=p.x+Math.cos(a2)*p.spd*dt, ay=p.y+Math.sin(a2)*p.spd*dt; if (!blocked(ax,ay,.3)){ p.x=ax; p.y=ay; break; } }
      } else { p.dir=R()*TAU; }
    }
    if ((p.state==='dig'||p.state==='chop') && R()<dt*4) burst(p.x+.3,p.y+.1,2,'chip');
  }
  poachers=poachers.filter(p=>!p.dead);

  // poachers returning, lighting fires, digging
  for (let k=returning.length-1;k>=0;k--) if (elapsed>=returning[k].t){ const r=returning.splice(k,1)[0]; spawnReturningPoacher(r); }
  fireTimer-=dt;
  if (fireTimer<=0){
    fireTimer=CFG.FIRE_EVERY_MIN+R()*(CFG.FIRE_EVERY_MAX-CFG.FIRE_EVERY_MIN);
    if (rewild>.05 && burning.length<CFG.MAX_NEW_FIRE){
      const c=poachers.filter(p=>{const i=tileAt(p.x,p.y); return p.kind==='poacher'&&i>=0&&stage[i]>=1&&moist[i]<.2&&p.state!=='flee';});
      if (c.length){ const p=c[(R()*c.length)|0]; if (ignite(tileAt(p.x,p.y))) toast('A poacher lit a fire. Spray it out before it spreads'); }
    }
  }
  chopTimer-=dt;
  if (chopTimer<=0){
    chopTimer=CFG.CHOP_EVERY_MIN+R()*(CFG.CHOP_EVERY_MAX-CFG.CHOP_EVERY_MIN);
    const c=poachers.filter(p=>p.kind==='poacher'&&(p.state==='wander'||p.state==='idle'));
    for (let k=0;k<6&&c.length;k++){
      const p=c.splice((R()*c.length)|0,1)[0], j=nearestTree(p.x,p.y,10);
      if (j>=0){ p.state='toChop'; p.goal=j; p.t=25; p.think=false; break; }
    }
  }
  digTimer-=dt;
  if (digTimer<=0){
    digTimer=CFG.DIG_EVERY_MIN+R()*(CFG.DIG_EVERY_MAX-CFG.DIG_EVERY_MIN);
    const c=poachers.filter(p=>p.kind==='poacher'&&p.state!=='flee'&&p.state!=='dig'&&p.state!=='toChop'&&p.state!=='chop'&&stage[tileAt(p.x,p.y)]>=1);
    if (c.length){ const p=c[(R()*c.length)|0]; p.state='dig'; p.spd=0; p.t=CFG.DIG_TIME; p.think=false; }
  }
  for (const i of burning) if (blaze[i]>0 && R()<dt*2.5) burst(i%W+.5,((i/W)|0)+.5,1,'smoke');

  // animals
  animalTimer-=dt;
  if (animalTimer<=0){
    animalTimer=CFG.ANIMAL_SPAWN_EVERY;
    const max=Math.min(CFG.ANIMAL_MAX,Math.floor(rewild*160));
    if (animals.length<max){
      for (let k=0;k<40;k++){
        const x=(R()*W)|0, y=(R()*H)|0, i=y*W+x;
        if (stage[i]<2) continue;
        let lush=0;
        for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const j=tileAt(x+dx,y+dy); if (j>=0&&stage[j]>=2) lush++; }
        if (lush>=6 && reach[i] && !(k<30 && densAt(x,y)>2)){
          const type=pickAnimal(k=>ANIMALS[k].hab==='water'?wdist[i]<=2:ANIMALS[k].hab==='trees'?stage[i]===3:true);
          let ax=x+.5, ay=y+.5;
          if (ANIMALS[type].hab==='water'){ // slip into the nearest water
            for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++){ const j=tileAt(x+dx+.5,y+dy+.5); if (j>=0&&terr[j]===WATER){ ax=x+dx+.5; ay=y+dy+.5; } }
          }
          spawnAnimal(ax,ay,type,.55);
          if (HERD_TYPES.has(type)) for (let q=0,n=2+((R()*3)|0);q<n;q++){ // the rest of the herd
            let bx=ax+(R()-.5)*3, by=ay+(R()-.5)*2; if (!goodHabitat(type,tileAt(bx,by))){ bx=ax; by=ay; }
            spawnAnimal(bx,by,type,.55+R()*.35);
          }
          break;
        }
      }
    }
  }
  densT-=dt; if (densT<=0){ densT=.5; updateDensity(); }
  reachT-=dt; if (reachT<=0){ reachT=2; computeReach(); }
  for (const h of herds){ h.t-=dt; if (h.t<=0){ h.t=10+R()*18; moveHerd(h); } }
  thirstT-=dt;
  if (thirstT<=0){
    thirstT=10;
    const warn={}, died={}; let nw=0, nd=0;
    for (const a of animals){
      if (a.dry>=CFG.THIRST_WARN+CFG.THIRST_DIE){ a.gone=true; died[a.type]=(died[a.type]||0)+1; nd++; burst(a.x,a.y,8,'smoke'); }
      else if (a.dry>=CFG.THIRST_WARN && !a.warned){ a.warned=true; warn[a.type]=(warn[a.type]||0)+1; nw++; }
    }
    const list=o=>Object.entries(o).map(([k,n])=>n+' '+(n===1?ANIMALS[k].name:plural(ANIMALS[k].name))).join(', ');
    if (nw) toast('No green path to water for '+list(warn)+'. Link their patch to a lake or stream','big');
    if (nd){ toast(list(died)+(nd===1?' has':' have')+' died of thirst'); animals=animals.filter(a=>!a.gone); }
  }
  for (const a of animals){
    const A=ANIMALS[a.type];
    if (!(a.type==='beaver' && updateBeaver(a,dt))){
      a.t-=dt;
      if (a.t<=0){
        if (R()<.3){ a.vx=a.vy=0; a.tx=null; a.t=1+R()*2.5; }
        else { pickRoam(a); a.t=a.herd?1.5+R()*2:3+R()*5; }
      }
      if (a.tx!=null){ // head for the chosen spot, sliding along the edges of green corridors
        const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
        if (d<.4){ a.tx=null; a.vx=a.vy=0; a.t=Math.min(a.t,1.5); }
        else {
          const sp=A.spd*(.6+.4*a.scale), base=Math.atan2(dy,dx), cur=tileAt(a.x,a.y), side=a.side||1;
          let moved=false;
          for (const off of [0,.6,-.6,1.2,-1.2,1.8,-1.8]){
            const ang=base+off*side, nx=a.x+Math.cos(ang)*sp*dt, ny=a.y+Math.sin(ang)*sp*dt;
            if (!animalBlocked(a.type,cur,tileAt(nx,ny))){ a.vx=Math.cos(ang)*sp; a.vy=Math.sin(ang)*sp; a.x=nx; a.y=ny; moved=true; break; }
          }
          if (moved) a.hop+=dt*A.spd*3; else { a.tx=null; a.vx=a.vy=0; a.side=-side; }
          if (a.vx) a.face=a.vx>0?1:-1;
        }
      } else if (a.vx||a.vy){
        const nx=a.x+a.vx*dt, ny=a.y+a.vy*dt;
        const cur=tileAt(a.x,a.y), nxt=tileAt(nx,ny);
        if (animalBlocked(a.type,cur,nxt)){ a.vx=a.vy=0; a.t=.3; }
        else { a.x=nx; a.y=ny; a.hop+=dt*A.spd*3; }
        if (a.vx) a.face=a.vx>0?1:-1;
      }
    }
    if (a.type==='bird') a.z+=((a.vx||a.vy?1:0)-a.z)*Math.min(1,dt*2);
    a.scale=Math.min(1,a.scale+dt*.004);
    // water access: needed to breed, and to survive
    if (hasWater(a)){
      a.dry=0; a.warned=false;
      if (a.scale>=1 && (a.natYoung||0)<CFG.NAT_YOUNG){
        if (a.nextNat===undefined) a.nextNat=elapsed+CFG.NAT_BREED_MIN+R()*(CFG.NAT_BREED_MAX-CFG.NAT_BREED_MIN);
        else if (elapsed>=a.nextNat && animals.length<CFG.ANIMAL_HARD_MAX){
          a.natYoung=(a.natYoung||0)+1; a.nextNat=elapsed+CFG.NAT_BREED_MIN+R()*(CFG.NAT_BREED_MAX-CFG.NAT_BREED_MIN);
          let bx=a.x+(R()-.5)*1.2, by=a.y+(R()-.5)*1.2; if (!goodHabitat(a.type,tileAt(bx,by))){ bx=a.x; by=a.y; }
          const b=spawnAnimal(bx,by,a.type,.5); if (a.herd){ b.herd=a.herd; }
          burst(a.x,a.y-.4,4,'heart');
        }
      }
    } else a.dry+=dt;
    a.fert-=dt;
    if (a.fert<=0){ // droppings and carried seeds
      a.fert=3+R()*3;
      const j=tileAt(a.x+(R()*7-3.5),a.y+(R()*7-3.5));
      if (j>=0) addProg(j,.5*a.scale);
    }
  }

  // butterflies drift around near the player wherever the ground is alive
  const flyMax=Math.min(18,Math.floor(3+rewild*40));
  if (flies.length<flyMax && R()<dt*2){
    const x=player.x+(R()-.5)*30, y=player.y+(R()-.5)*18, j=tileAt(x,y);
    if (j>=0 && terr[j]!==WATER && stage[j]>=1) flies.push({x,y,z:.4+R()*.5,vx:0,vy:0,ph:R()*10,life:20+R()*20,col:FLY_COLS[(R()*FLY_COLS.length)|0]});
  }
  for (const b of flies){
    b.ph+=dt; b.life-=dt;
    b.vx+=(R()-.5)*dt*6; b.vy+=(R()-.5)*dt*6; const v=Math.hypot(b.vx,b.vy); if (v>1.2){ b.vx*=1.2/v; b.vy*=1.2/v; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.z=clamp(b.z+Math.sin(b.ph*2)*dt*.3,.3,1.1);
    if (Math.hypot(b.x-player.x,b.y-player.y)>35) b.life=0;
  }
  for (let k=flies.length-1;k>=0;k--) if (flies[k].life<=0) flies.splice(k,1);

  for (const h of huts) for (const a of h.captives){
    a.hop+=dt*2; if (R()<dt*.5){ a.ox=clamp(a.ox+(R()-.5)*.5,-.8,.8); a.oy=clamp(a.oy+(R()-.5)*.3,-.3,.45); a.face=R()<.5?-1:1; }
  }
  // particles
  for (const p of parts){
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if (p.type==='heart'||p.type==='sparkle'||p.type==='smoke'||p.type==='ring'){ p.z+=p.vz*dt; }
    else { p.z+=p.vz*dt; p.vz-=12*dt; if (p.z<0){ p.z=0; p.vz=0; p.vx*=.5; p.vy*=.5; } }
    if (p.type==='leaf'){ p.vz=Math.max(p.vz,-1.2); }
  }
  parts=parts.filter(p=>p.life>0);

  // simulation
  simAcc+=dt; let n=0;
  while (simAcc>=CFG.SIM_DT && n<2){ simAcc-=CFG.SIM_DT; simTick(); n++; }
  if (simAcc>CFG.SIM_DT) simAcc=0;

  // milestones & win
  while (milestones.length && rewild>=milestones[0]){
    const m=milestones.shift(); toast(Math.round(m*100)+'% of the land is rewilded','big');
  }
  if (!winShown && rewild>=CFG.WIN_AT){ winShown=true; showWin(); }
}
let lastEmptyToast=-99;

/* ---------------- Draw ---------------- */
function screenToWorld(mx,my){
  return { x: cam.x+(mx*RS-cw/2)/TSD, y: cam.y+(my*RS-chh/2)/TSD };
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#2b2118'; ctx.fillRect(0,0,cw,chh);
  const oxr=Math.round(cw/2-cam.x*TSD), oyr=Math.round(chh/2-cam.y*TSD);
  const x0=Math.max(0,Math.floor(-oxr/TSD)), x1=Math.min(W-1,Math.floor((cw-oxr)/TSD));
  const y0=Math.max(0,Math.floor(-oyr/TSD)), y1=Math.min(H-1,Math.floor((chh-oyr)/TSD));

  for (let cy=(y0/CH)|0; cy<=((y1/CH)|0); cy++)
    for (let cx=(x0/CH)|0; cx<=((x1/CH)|0); cx++)
      ctx.drawImage(getChunk(cx,cy).c, oxr+cx*CH*TSD, oyr+cy*CH*TSD);

  // live overlays: water glints, wet ground and sprouts on bare tiles
  const s=TSD, tm=performance.now()/1000; nowT=tm;
  const foam=new Path2D(), fo=s*(.1+.04*Math.sin(tm*1.4));
  ctx.beginPath();
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const i=y*W+x, px=oxr+x*s, py=oyr+y*s;
    if (terr[i]===WATER){
      const ph=Math.sin(tm*1.6+hash2(x,y,DS+200)*TAU);
      if (ph>.8){ ctx.fillStyle='rgba(255,255,255,'+((ph-.8)*3).toFixed(2)+')'; ctx.fillRect(px+s*(.15+hash2(x,y,DS+201)*.5),py+s*(.2+hash2(x,y,DS+202)*.6),s*.28,Math.max(1,s*.05)); }
      if (depth[i]===0 && !dam[i]){
        const e=s*.18; // foam breaks up near corners so it follows the rounded shore
        if (y>0&&terr[i-W]!==WATER){ foam.moveTo(px+e,py+fo); foam.lineTo(px+s-e,py+fo); }
        if (y<H-1&&terr[i+W]!==WATER){ foam.moveTo(px+e,py+s-fo); foam.lineTo(px+s-e,py+s-fo); }
        if (x>0&&terr[i-1]!==WATER){ foam.moveTo(px+fo,py+e); foam.lineTo(px+fo,py+s-e); }
        if (x<W-1&&terr[i+1]!==WATER){ foam.moveTo(px+s-fo,py+e); foam.lineTo(px+s-fo,py+s-e); }
      }
      continue;
    }
    const m=moist[i];

/* ---------------- HUD ---------------- */
const el=id=>document.getElementById(id);
const hud={conv:el('convN'),stream:el('streamN'),wild:el('wild'),species:el('species'),covBars:[...document.querySelectorAll('.cover i')],covTxt:[...document.querySelectorAll('.legend b')],ret:el('returnN'),fires:el('fireN'),pct:el('pct'),pctFill:el('pctFill'),poach:el('poachN'),animal:el('animalN'),time:el('timeN'),water:el('waterFill'),ws:el('waterStatus')};
function fmtTime(t){const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+(s<10?'0':'')+s;}
function updateHud(){
  const pc=Math.min(100,Math.floor(rewild*1000)/10);
  hud.pct.firstChild.nodeValue=pc.toFixed(1);
  hud.pctFill.style.width=pc+'%';
  let ns=0; for (const p of poachers) if (p.kind==='stealer') ns++;
  hud.poach.textContent=poachers.length-ns; el('stealN').textContent=ns;
  let pen=0; for (const h of huts) pen+=h.captives.length; for (const p of poachers) if (p.carry) pen++;
  el('penN').textContent=pen;
  hud.ret.textContent=poachersLeft-poachers.length;
  hud.conv.textContent=totalVisits-poachersLeft;
  hud.stream.textContent=(beaverWater*5)+' m';
  const L=landCount||1, pcs=[(cover[0]-burntN)/L,cover[1]/L,cover[2]/L,cover[3]/L,burntN/L];
  for (let k=0;k<5;k++){ hud.covBars[k].style.width=(pcs[k]*100)+'%'; hud.covTxt[k].textContent=Math.round(pcs[k]*100)+'%'; }
  const cnt={}; for (const a of animals) cnt[a.type]=(cnt[a.type]||0)+1;
  const kinds=Object.keys(cnt).length;
  hud.animal.textContent=animals.length+(kinds?' ('+kinds+' kinds)':'');
  if (hud.wild.open){
    const rows=ANIMAL_KEYS.map(k=>[ANIMALS[k].name,cnt[k]||0]).sort((p,q)=>q[1]-p[1]||p[0].localeCompare(q[0]));
    const html=rows.map(([n,c])=>'<span'+(c?'':' class="z"')+'>'+n[0].toUpperCase()+n.slice(1)+'</span><b'+(c?'':' class="z"')+'>'+c+'</b>').join('');
    if (hud.species.innerHTML!==html) hud.species.innerHTML=html;
  }
  hud.fires.textContent=burning.length;
  { let t=0; for (const a of animals) if (a.dry>5) t++; el('thirstN').textContent=t; }
  hud.time.textContent=fmtTime(elapsed);
  hud.water.style.width=(player.water/CFG.TANK*100)+'%';
  const empty=player.water<CFG.SHOT_COST;
  hud.ws.textContent= player.refilling&&player.water<CFG.TANK ? 'Refilling' : empty ? 'Empty' : Math.round(player.water/CFG.TANK*100)+'%';
  hud.ws.className= empty&&!player.refilling?'empty':'';
}
const toastBox=el('toasts');
function toast(msg,cls){
  const d=document.createElement('div'); d.className='toast'+(cls?' '+cls:''); d.textContent=msg;
  toastBox.appendChild(d);
  while (toastBox.children.length>4) toastBox.firstChild.remove();
  setTimeout(()=>d.classList.add('fade'),3200); setTimeout(()=>d.remove(),3800);
}

/* ---------------- Screens ---------------- */
const overlay=el('overlay'), card=el('card');
function showCard(html,buttons){
  card.innerHTML=html;
  const b=document.createElement('div'); b.className='btns';
  for (const [label,fn,ghost] of buttons){
    const btn=document.createElement('button'); btn.textContent=label; if (ghost) btn.className='ghost';
    btn.onclick=fn; b.appendChild(btn);
  }
  card.appendChild(b); overlay.classList.remove('hidden');
  b.firstChild.focus();
}
function hideCard(){ overlay.classList.add('hidden'); }
const HELP='<ul><li><b>WASD</b> or arrow keys to move</li><li><b>Mouse</b> to aim, <b>click</b> or hold to spray</li><li>Stand beside a lake to refill your tank</li><li>Hit a poacher to turn them into a tree or an animal. Each one comes back twice, as a different animal every time</li><li>Purple-dressed <b>stealers</b> catch animals and pen them. Rewild the stealer, then spray the hut to free them</li><li>Spray out fires. Burnt ground needs watering before it regrows</li><li>Spray a new animal (fresh from a poacher) a few times within a minute and it has young. Animals with a green path to water breed on their own, and die if cut off too long</li><li>Keep watering a finished patch and it grows into scrub, then trees</li><li>Beavers walk to a lake and dig streams and ponds</li><li><b>Scroll</b> or <b>+ / −</b> to zoom</li><li><b>M</b> to toggle music, <b>Esc</b> to pause</li></ul>';
function showTitle(){
  state='title';
  showCard('<h1>Rewild<span>Stage 1</span></h1><p>The land is bare and poachers roam it. Water the ground and it comes back to life, and living land spreads to its neighbours.</p>'+HELP,
    [['Start rewilding',()=>{hideCard();state='play';Music.start();}],['New map',()=>{generate((Math.random()*1e9)|0);},true]]);
}
function pause(){ state='pause'; mouse.down=false;
  showCard('<h1>Paused</h1><p>'+(rewild*100).toFixed(1)+'% rewilded in '+fmtTime(elapsed)+'.</p>'+HELP,
    [['Resume',resume],['New map',()=>{generate((Math.random()*1e9)|0);showTitle();},true]]); }
function resume(){ hideCard(); state='play'; }
function showWin(){ state='win'; mouse.down=false;
  showCard('<h1>It lives</h1><p>You rewilded the whole square kilometre in '+fmtTime(elapsed)+', with '+animals.length+' animals now roaming and '+poachersLeft+' poacher visits still to come.</p>',
    [['Keep exploring',resume],['New map',()=>{generate((Math.random()*1e9)|0);showTitle();},true]]); }

/* ---------------- Music ---------------- */
const Music={
  ctx:null, on:true, beat:60/72, step:0,
  start(){
    if (this.ctx) { this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return;
    const c=this.ctx=new AC();
    this.master=c.createGain(); this.master.gain.value=this.on?.32:0; this.master.connect(c.destination);
    this.bus=c.createGain(); this.bus.connect(this.master);
    const d=c.createDelay(); d.delayTime.value=this.beat*.75; const fb=c.createGain(); fb.gain.value=.38;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000;
    const wet=c.createGain(); wet.gain.value=.45;
    this.bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(this.master);
    this.next=c.currentTime+.2; this.mel=2;
  },
  toggle(){ this.on=!this.on; if (this.master) this.master.gain.setTargetAtTime(this.on?.32:0,this.ctx.currentTime,.2); musicBtn.textContent=this.on?'Music on (M)':'Music off (M)'; },
  note(m,t,dur,vol,type,att){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=440*Math.pow(2,(m-69)/12);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+dur+.05);
  },
  chirp(t){
    const c=this.ctx, n=2+((Math.random()*3)|0), base=2400+Math.random()*1400;
    for (let k=0;k<n;k++){
      const o=c.createOscillator(), g=c.createGain(), tt=t+k*.11;
      o.type='sine'; o.frequency.setValueAtTime(base,tt); o.frequency.exponentialRampToValueAtTime(base*1.45,tt+.07);
      g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.025,tt+.01); g.gain.exponentialRampToValueAtTime(.0001,tt+.09);
      o.connect(g); g.connect(this.bus); o.start(tt); o.stop(tt+.12);
    }
  },
  tick(){
    if (!this.ctx || !this.on) return;
    const c=this.ctx, e=this.beat/2;
    const CH=[[50,57,61,66],[47,54,57,62],[43,50,54,59],[45,52,57,61,64]]; // Dmaj7 Bm7 Gmaj7 Aadd9
    const SC=[74,76,78,81,83,86,88];
    while (this.next<c.currentTime+.6){
      const t=this.next, st=this.step, ch=CH[((st/16)|0)%4];
      if (st%16===0){ for (const m of ch) this.note(m,t,e*17,.035,'sine',1.4); this.note(ch[0]-12,t,e*15,.07,'triangle',.3); }
      const life=Math.min(1,rewild*1.4);
      if (R()<.18+.35*life && st%2===(R()<.7?0:1)){
        this.mel=clamp(this.mel+((R()*5)|0)-2,0,SC.length-1);
        this.note(SC[this.mel],t,e*3,.05,'triangle',.01);
      }
      if (R()<life*.06+animals.length*.0006) this.chirp(t);
      this.next+=e; this.step++;
    }
  }
};
const musicBtn=document.getElementById('musicBtn');
musicBtn.onclick=()=>Music.toggle();
addEventListener('keydown',e=>{ if (e.code==='KeyM') Music.toggle(); });

/* ---------------- Loop ---------------- */
let last=performance.now(), hudT=0, mmT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; frame++;
  if (state==='play') update(dt);
  // camera
  const k=1-Math.pow(.001,dt);
  cam.x+=(player.x-cam.x)*k; cam.y+=(player.y-cam.y)*k;
  const hw=cw/2/TSD, hh=chh/2/TSD;
  cam.x = W>hw*2 ? clamp(cam.x,hw,W-hw) : W/2;
  cam.y = H>hh*2 ? clamp(cam.y,hh,H-hh) : H/2;
  Music.tick();
  flushDirty();
  render();
  if (frame%60===0) evictChunks();
  hudT-=dt; if (hudT<=0){ hudT=.1; updateHud(); }
  mmT-=dt; if (mmT<=0){ mmT=.25; drawMinimap(); }
  requestAnimationFrame(loop);
}

resize();
generate((Math.random()*1e9)|0);
showTitle();
updateHud(); drawMinimap();
requestAnimationFrame(loop);
})();
